<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mohammed Almnyawe — Senior Graphic Designer</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root{
 --bg:#eef2ef;
 --text:#1f2a26;
 --muted:#4f6b60;
 --line:#7fa397;
 --accent:#FBDC86;
 --card:#ffffff;
 --grid-color:rgba(31,42,38,.055);
}
body.dark{
 --bg:#101214;
 --text:#f3f3f3;
 --muted:#b9c4bf;
 --line:#6d8a80;
 --accent:#E9B44C;
 --card:#1a1d20;
 --grid-color:rgba(255,255,255,.045);
}

*{box-sizing:border-box}

body{
  transition:background .35s,color .35s;
  margin:0;
  font-family:'Inter',sans-serif;
  background-color:var(--bg);
  color:var(--text);
}


.grid-bg{
position:fixed;
inset:0;
z-index:-1;
pointer-events:none;
background-image:
radial-gradient(circle 170px at var(--mx,50%) var(--my,50%),
rgba(233,180,76,.18) 0%,
rgba(233,180,76,.08) 28%,
transparent 70%),
linear-gradient(var(--grid-color) 1px,transparent 1px),
linear-gradient(90deg,var(--grid-color) 1px,transparent 1px);
background-size:auto,48px 48px,48px 48px;
transition:transform .15s ease-out, background .08s linear;
will-change:transform,background;
}

/* HERO */

.hero{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:90px;
  padding:60px;
}

.image-wrapper{
  position:relative;
  --moveX:0px;
  --moveY:0px;
  --circleScale:1;
}

.image-wrapper::before{
  content:"";
  position:absolute;
  width:240px;
  height:240px;
  background:var(--accent);
  border-radius:50%;
  top:-50px;
  left:-60px;
  z-index:0;
  transform:
    translate(var(--moveX),var(--moveY))
    scale(var(--circleScale));
  transition:transform .2s ease-out;
}

.profile-img{
  width:400px;
  position:relative;
  z-index:1;
  filter:drop-shadow(0 25px 50px rgba(0,0,0,.08));
  transition:.35s;
}

/* CONTENT */

.content{
  display:flex;
  flex-direction:column;
}

.content h1{
  font-size:42px;
  font-weight:700;
  margin:-10px 0 8px;
}

.mobile-break{display:none}

.role{
  text-transform:uppercase;
  font-size:14px;
  letter-spacing:2px;
  color:var(--muted);
}

.line{
  width:40px;
  height:2px;
  background:var(--line);
  margin:18px 0 30px;
}

/* BUTTONS */

.buttons{
  display:flex;
  gap:12px;
  margin-bottom:30px;
}

.btn{
  padding:12px 18px;
  border-radius:6px;
  border:1px solid var(--text);
  text-decoration:none;
  font-size:14px;
  color:var(--text);
  transition:.25s ease;
  white-space:nowrap;
}

.btn:hover{transform:translateY(-3px)}

.primary{
  background:var(--accent);
  border:none;
  font-weight:600;

  color:#111111;
}

/* SOCIAL */

.socials{
  display:flex;
  gap:16px;
  margin-bottom:30px;
}

.socials a{
  width:44px;
  height:44px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid var(--text);
  color:var(--text);
  font-size:17px;
  transition:.3s ease;
  text-decoration:none;
}

.socials a:hover{
  background:var(--accent);
  border-color:#FBDC86;
  transform:translateY(-5px);
}

.contact a{
  color:var(--muted);
  text-decoration:none;
  border-bottom:1px solid rgba(62,94,84,.3);
  font-size:14px;
}


.theme-switch{
position:fixed;top:24px;right:24px;width:72px;height:38px;border-radius:999px;
border:1px solid rgba(0,0,0,.08);background:rgba(255,255,255,.75);
backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:space-between;
padding:0 9px;cursor:pointer;z-index:9999;box-shadow:0 10px 30px rgba(0,0,0,.12)}
.theme-switch .thumb{position:absolute;left:3px;width:30px;height:30px;border-radius:50%;
background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.2);transition:.3s}
body.dark .theme-switch{background:rgba(35,35,35,.8);border-color:rgba(255,255,255,.1)}
body.dark .theme-switch .thumb{transform:translateX(34px);background:#222}
.theme-switch span{z-index:2;font-size:14px}


.theme-switch .sun,
.theme-switch .moon{
    z-index:2;
    font-size:14px;
    transition:.3s ease;
}
.theme-switch .sun{color:#f5b301;}
.theme-switch .moon{color:#8b8b8b;}
body.dark .theme-switch .sun{color:#707070;}
body.dark .theme-switch .moon{color:#ffd54a;}


.hero,.content>*,.image-wrapper{
opacity:0;
}
body.loaded .hero{animation:fadeHero .7s ease forwards;}
body.loaded .image-wrapper{animation:up .8s .1s ease forwards;}
body.loaded .content>*{animation:up .7s ease forwards;}
body.loaded .content>*:nth-child(1){animation-delay:.15s}
body.loaded .content>*:nth-child(2){animation-delay:.25s}
body.loaded .content>*:nth-child(3){animation-delay:.35s}
body.loaded .content>*:nth-child(4){animation-delay:.45s}
body.loaded .content>*:nth-child(5){animation-delay:.55s}
@keyframes up{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes fadeHero{to{opacity:1}}

.profile-img{transition:transform .35s ease,filter .35s ease;}
.image-wrapper:hover .profile-img{
 transform:scale(1.02);
 filter:drop-shadow(0 35px 60px rgba(0,0,0,.18));
}
.image-wrapper:hover::before{
 transform:translate(var(--moveX),var(--moveY)) scale(1.08);
}
.btn{transition:transform .25s ease;}

/* MOBILE */

@media(max-width:768px){

  .hero{
    flex-direction:column;
    text-align:center;
    gap:30px;
    padding:35px 20px;
  }

  .content{
    align-items:center;
  }

  .line{
    margin:18px auto 30px;
  }

  .image-wrapper::before{
    width:180px;
    height:180px;
    top:-40px;
    left:-45px;
  }

  .profile-img{
    width:280px;
  }

  .content h1{
    font-size:30px;
    line-height:1.2;
  }

  .mobile-break{display:inline}

  .buttons{
    justify-content:center;
    gap:8px;
  }

  .btn{
    font-size:14px;
    padding:14px 14px;
    border-radius:8px;
  }

  .socials{
    justify-content:center;
  }
}

/* DESKTOP CURSOR */

@media(min-width:769px){

  body{cursor:none}

  .custom-cursor{
    position:fixed;
    width:8px;
    height:8px;
    background:var(--accent);
    border-radius:50%;
    pointer-events:none;
    transform:translate(-50%,-50%);
    z-index:9999;
  }
}

</style>
</head>

<body>
<div class="grid-bg"></div>
<button id="themeToggle" class="theme-switch" aria-label="Toggle theme">
<span class="sun"><i class="fa-solid fa-sun"></i></span><span class="thumb"></span><span class="moon"><i class="fa-solid fa-moon"></i></span>
</button>


<section class="hero">

  <div class="image-wrapper" id="imageWrapper">
    <img src="profile.png" class="profile-img">
  </div>

  <div class="content">

    <h1>
      Mohammed <br class="mobile-break"> Almnyawe
    </h1>

    <div class="role">Senior Graphic Designer</div>
    <div class="line"></div>

    <div class="buttons">
      <a href="cv.pdf"
         download="Mohammed Almnyawe - Resume 2026.pdf"
         class="btn">Download CV</a>

      <a href="portfolio.pdf"
         download="Mohammed Almnyawe - Portfolio 2026.pdf"
         class="btn">Download Portfolio</a>

      <a href="https://wa.me/201050004005"
         target="_blank"
         class="btn primary">Hire Me</a>
    </div>

    <div class="socials">
      <a href="https://www.facebook.com/m.almnyawe/" target="_blank"><i class="fab fa-facebook-f"></i></a>
      <a href="https://www.instagram.com/m.mnya/" target="_blank"><i class="fab fa-instagram"></i></a>
      <a href="https://www.linkedin.com/in/almnyawe/" target="_blank"><i class="fab fa-linkedin-in"></i></a>
      <a href="https://www.behance.net/almnyawe" target="_blank"><i class="fab fa-behance"></i></a>
    </div>

    <div class="contact">
      <a href="mailto:contact@mnyawe.com">contact@mnyawe.com</a>
    </div>

  </div>

</section>

<script>

if(window.innerWidth>768){

  const wrapper=document.getElementById("imageWrapper");

  wrapper.addEventListener("mousemove",(e)=>{
    const rect=wrapper.getBoundingClientRect();
    const x=(e.clientX-rect.left-rect.width/2)/20;
    const y=(e.clientY-rect.top-rect.height/2)/20;
    wrapper.style.setProperty("--moveX",x+"px");
    wrapper.style.setProperty("--moveY",y+"px");
  });

  wrapper.addEventListener("mouseenter",()=>{
    wrapper.style.setProperty("--circleScale","1.05");
  });

  wrapper.addEventListener("mousedown",()=>{
    wrapper.style.setProperty("--circleScale","0.92");
  });

  wrapper.addEventListener("mouseup",()=>{
    wrapper.style.setProperty("--circleScale","1.05");
  });

  wrapper.addEventListener("mouseleave",()=>{
    wrapper.style.setProperty("--moveX","0px");
    wrapper.style.setProperty("--moveY","0px");
    wrapper.style.setProperty("--circleScale","1");
  });

  const cursor=document.createElement("div");
  cursor.classList.add("custom-cursor");
  document.body.appendChild(cursor);

  document.addEventListener("mousemove",(e)=>{
    cursor.style.left=e.clientX+"px";
    cursor.style.top=e.clientY+"px";
  });

  // ORIGINAL RIPPLE
  document.addEventListener("click",(e)=>{

    const ripple=document.createElement("div");

    ripple.style.position="fixed";
    ripple.style.left=e.clientX+"px";
    ripple.style.top=e.clientY+"px";
    ripple.style.width="8px";
    ripple.style.height="8px";
    ripple.style.border="2px solid #FBDC86";
    ripple.style.borderRadius="50%";
    ripple.style.transform="translate(-50%,-50%) scale(1)";
    ripple.style.pointerEvents="none";
    ripple.style.opacity="0.6";
    ripple.style.transition="all .35s ease-out";
    ripple.style.zIndex="9998";

    document.body.appendChild(ripple);

    setTimeout(()=>{
      ripple.style.transform="translate(-50%,-50%) scale(3)";
      ripple.style.opacity="0";
    },10);

    setTimeout(()=>ripple.remove(),350);

  });

}


const t=document.getElementById('themeToggle');
function apply(){
 const d=localStorage.getItem('theme')==='dark';
 document.body.classList.toggle('dark',d);
}
apply();
t.onclick=()=>{
 const d=!document.body.classList.contains('dark');
 localStorage.setItem('theme',d?'dark':'light');
 apply();
};


const grid=document.querySelector('.grid-bg');
document.addEventListener('mousemove',(e)=>{
 const x=(e.clientX/window.innerWidth-0.5)*18;
 const y=(e.clientY/window.innerHeight-0.5)*18;
 grid.style.transform=`translate(${x}px,${y}px)`;
 grid.style.setProperty('--mx',e.clientX+'px');
 grid.style.setProperty('--my',e.clientY+'px');
});


window.addEventListener('load',()=>document.body.classList.add('loaded'));

const hire=document.querySelector('.primary');
if(hire){
hire.addEventListener('mousemove',e=>{
 const r=hire.getBoundingClientRect();
 const x=(e.clientX-r.left-r.width/2)/8;
 const y=(e.clientY-r.top-r.height/2)/8;
 hire.style.transform=`translate(${x}px,${y}px)`;
});
hire.addEventListener('mouseleave',()=>hire.style.transform='translate(0,0)');
}

</script>

</body>
</html>

<style>
body.dark .primary{
  background:#E9B44C;
  color:#111111;
}
</style>
